name: home-3d-workshop
version: 0.1.0
description: >-
  A household 3D-printing workshop with a character. Family members ask in plain language (text or
  voice note); the agent finds or customises a model, or designs a new part in OpenSCAD (render, look at
  the previews, iterate), slices it, queues it, watches the print with a zero-token watcher, tells the
  owner and the family (in different tones), checks the plate with the camera for the next job, and
  turns every "a human had to step in" moment into an upgrade proposal.
  Works with a Bambu Lab printer managed by Bambuddy, or with the built-in simulated printer.
author: Wijt
kind: standalone
license: MIT
homepage: https://github.com/Wijt/hermes-home-3d-workshop
requires_hermes: ">=0.22.5"
tags: [3d-printing, bambu, bambuddy, household, family, makerworld, openscad, automation]
provides_tools:
  - home3d_status
  - home3d_camera
  - home3d_find_models
  - home3d_import
  - home3d_customize
  - home3d_design
  - home3d_slice
  - home3d_queue
  - home3d_start
  - home3d_stop
  - home3d_clear_plate
  - home3d_household
  - home3d_human_needed
  - home3d_upgrades
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - pre_gateway_dispatch
config_schema:
  backend:
    type: str
    choices: [simulator, bambuddy]
    default: simulator
    label: Printer backend
    description: "'simulator' needs no hardware (try it, CI). 'bambuddy' talks to a Bambuddy server on your LAN."
  bambuddy_url:
    type: str
    default: ""
    label: Bambuddy URL
    description: "Base URL of your Bambuddy server, e.g. http://192.168.1.50:8000 (API is under /api/v1)."
  public_url:
    type: str
    default: ""
    label: Public Bambuddy URL for links
    description: "Optional URL used in links sent to people (preview / download). Defaults to bambuddy_url."
  printer_id:
    type: int
    default: 1
    label: Bambuddy printer id
  bambuddy_api_key:
    type: secret
    env: HOME3D_BAMBUDDY_API_KEY
    description: "Only needed when Bambuddy API auth is enabled (sent as X-API-Key)."
  persona_name:
    type: str
    default: "Mıstık"
    label: Persona name
    description: "Name of the household character the family talks to."
  language:
    type: str
    choices: [en, tr]
    default: en
    label: Household language
    description: "Language of family-facing messages, owner notices, /home3d replies and the persona's replies about printing. English by default; a Turkish household sets tr (hermes home3d demo is English unless --lang tr)."
  owner_name:
    type: str
    default: "Owner"
    label: Owner display name
  owner_ids:
    type: list
    default: []
    label: Owner sender ids
    description: "Messaging user ids that count as the owner for approvals. Compared exactly (a WhatsApp phone id may be written with or without its @s.whatsapp.net / @c.us suffix; @lid ids are a separate id space). On IRC and ntfy, where people choose their own ids, write the id with its platform (irc:<nick>): a bare id never matches a sender there. Check with /home3d whoami."
  local_is_owner:
    type: bool
    default: true
    label: Local sessions are the owner
    description: "A local CLI/TUI/desktop session (no messaging identity, or the gateway-hosted CLI's uid:<n> user) is the owner; slash commands from the TUI, Desktop and web dashboard count too. Runs with nobody present (cron, kanban workers, chat -q, -z, --source tool) are never the owner for a printer action. Turn off on a shared machine or a dashboard others can reach: then only owner_ids can approve."
  household:
    type: list
    default: []
    label: Household members
    description: 'List of {"id": "<sender id>", "name": "Mum", "address_as": "Anneciğim", "role": "family"}.'
  stop_policy:
    type: str
    choices: [known, anyone, owner]
    default: known
    label: Who may stop or pause a print
    description: "known: the owner and the people in the household list (default). anyone: every sender, also unknown ones and runs with nobody present. owner: the owner only. The owner can always type /home3d stop or /home3d pause. Who stopped a print is recorded and named in the owner notice."
  allow_guests:
    type: bool
    default: false
    label: Let unknown senders prepare prints
    description: "Off (default): a sender who is not the owner and not in the household list can only read the status; import, customize, design upload, slice and queue add / remove are refused. On: such a sender may prepare prints, recorded under a guest name; starting, resuming and marking the plate clear stay with the owner."
  inject_context:
    type: str
    choices: [auto, always, never]
    default: auto
    label: Per-turn printing context
    description: "auto: household members and the local owner get the persona/printer context on their first turn, when the printer changed or the message is about printing (or names the persona), and one 'Speaking: ...' line on other turns; other senders get it only on printing-related turns. always: every turn of every session. never: no context (the skill still loads on request)."
  owner_target:
    type: str
    default: ""
    label: Owner notification target
    description: "hermes send target for technical notices, e.g. whatsapp:<group>@g.us or telegram:<chat>."
  family_target:
    type: str
    default: ""
    label: Family notification target
    description: "hermes send target for short plain-language family notices. Empty = owner only."
  send_profile:
    type: str
    default: ""
    label: Profile that owns the messaging adapters
    description: "Hermes profile used for 'hermes send' (e.g. 'default' on a multi-profile gateway). Empty = current."
  groups:
    type: list
    default: []
    label: Groups the workshop serves
    description: 'List of {"name": "Lab", "target": "telegram:<group>", "language": "en", "tone": "team", "members": ["<sender id>"]}. A request belongs to the group whose target is the chat it came from, else the group listing its sender, else family_target (household members). Notices about a job go to its group in that group''s language; tone "team" is plain neutral wording, "family" the warm one. A requester in no group and not in the household is not announced; the owner is told. Empty = family_target as before.'
  send_timeout_s:
    type: float
    default: 20.0
    label: Seconds one notice send may take
    description: "One 'hermes send' is stopped after this long (1-120 s); a failed notice is retried on a later watcher pass."
  send_budget_s:
    type: float
    default: 45.0
    label: Seconds one watcher pass may spend sending
    description: "All notice sends of one watcher pass together; what does not fit goes out on the next pass."
  autoeject_printer_preset:
    type: str
    default: ""
    label: Auto-eject printer preset id
    description: "Bambuddy local printer preset id whose end G-code pushes the part off (contains the HOME3D/HERMES AUTO-EJECT marker). Empty = no auto-eject."
  standard_printer_preset:
    type: str
    default: ""
    label: Standard printer preset id
    description: "Bambuddy local printer preset id without auto-eject (used for parts that must not be pushed)."
  process_presets:
    type: dict
    default: {}
    label: Process presets by quality
    description: '{"draft": "0.28mm Extra Draft @BBL A1", "standard": "0.20mm Standard @BBL A1", "fine": "0.16mm High Quality @BBL A1"}'
  filament_presets:
    type: dict
    default: {}
    label: Filament preset ids by material
    description: '{"PLA": "12", "PETG": "15"} — Bambuddy local filament preset ids.'
  bed_type:
    type: str
    default: "Textured PEI Plate"
  eject_cool_temp_c:
    type: float
    default: 30.0
    label: Bed temperature below which the plate may be cleared
  watch_interval:
    type: str
    default: "2m"
    label: Watcher interval (cron schedule)
    description: "How often the zero-token watcher runs (hermes home3d setup writes it into the cron job: after a change, run hermes home3d teardown and setup again). The watcher counts as running for three intervals after a pass, at least 10 minutes."
