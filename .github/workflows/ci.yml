name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pillow
      - name: Tests (simulator only, no Hermes, no network)
        run: python -m pytest -q
      - name: End-to-end demo on the simulated printer
        run: |
          python - <<'EOF'
          import importlib.util, sys
          from pathlib import Path
          root = Path.cwd()
          spec = importlib.util.spec_from_file_location("home3d_ws", root / "__init__.py",
                                                        submodule_search_locations=[str(root)])
          mod = importlib.util.module_from_spec(spec)
          sys.modules["home3d_ws"] = mod
          spec.loader.exec_module(mod)
          from home3d_ws.home3d.cli import run_demo
          runs = [run_demo(lang=lang) for lang in ("en", "tr")]
          print("demo seconds:", [r.get("seconds") for r in runs])
          sys.exit(0 if all(r["ok"] for r in runs) else 1)
          EOF

  openscad:
    # AI modelling (home3d_design) with the real OpenSCAD: the two templates, a sample design and every .scad under
    # skills/parametric-design/templates render to a clean solid with a preview PNG (xvfb gives OpenSCAD a display),
    # and the file-access probes (sentinel files outside the design folder) are all refused.
    # HOME3D_REQUIRE_OPENSCAD=1 turns "openscad is not installed" from a skip into a failure. The runner image is
    # pinned: the docs say "OpenSCAD 2021.01", and ubuntu-24.04's apt package is that version (asserted below).
    name: real OpenSCAD renders (apt openscad + xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenSCAD and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb
          openscad --version 2>&1 | tee openscad-version.txt
          grep -q "version 2021.01" openscad-version.txt || { echo "::error::expected OpenSCAD 2021.01"; exit 1; }
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Real-OpenSCAD tests (renders, previews, errors, skill templates)
        env:
          HOME3D_REQUIRE_OPENSCAD: "1"
        run: python -m pytest -q tests/test_design.py -k real_openscad -rA

  hermes-validate:
    # The check the Hermes plugin catalog runs: install Hermes v0.22.5 from its git tag (Python 3.14 via uv, the
    # locked dependency set) and validate this checkout in a throwaway HERMES_HOME (never a real one). The same
    # steps pass locally; if a runner-side change ever breaks the Hermes install itself, mark this job
    # continue-on-error rather than skipping it, and say why here.
    name: hermes plugins validate (Hermes v0.22.5)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HERMES_TAG: v0.22.5
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: astral-sh/setup-uv@v6
      - name: Install Hermes ${{ env.HERMES_TAG }} (git tag, Python 3.14, uv sync --frozen)
        run: |
          git clone --quiet --depth 1 --branch "$HERMES_TAG" https://github.com/NousResearch/hermes-agent.git hermes
          cd hermes
          uv python install 3.14
          uv sync --frozen --python 3.14
      - name: hermes plugins validate . --install-deps
        working-directory: plugin
        run: |
          export HERMES_HOME="$(mktemp -d)"
          "$GITHUB_WORKSPACE/hermes/.venv/bin/hermes" plugins validate . --install-deps < /dev/null

  hygiene:
    name: compile + secret / personal-data scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile every module
        run: python -m compileall -q .
      - name: Scan for secrets and personal data
        shell: bash
        env:
          # optional repo secret: extra '|'-separated patterns (real names, the real printer address, ...)
          # so the private values never have to be written into this public file
          EXTRA_PATTERNS: ${{ secrets.PRIVATE_SCAN_PATTERNS }}
        run: |
          # real WhatsApp group / user ids, private keys and tokens (+ the private extra patterns)
          pattern='@g\.us[0-9]|[0-9]{6,}(-[0-9]+)?@g\.us|[0-9]{8,}@(s\.whatsapp\.net|lid)|-----BEGIN [A-Z ]*PRIVATE KEY|sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{30,}'
          if [ -n "$EXTRA_PATTERNS" ]; then pattern="$pattern|$EXTRA_PATTERNS"; fi
          hits=$(git grep -nIE "$pattern" -- . ':(exclude).github/workflows/ci.yml' || true)
          # LAN addresses: only the documented example 192.168.1.50 (and loopback) may appear
          ips=$(git grep -noIE '(10|172\.(1[6-9]|2[0-9]|3[01])|192\.168)\.[0-9]{1,3}\.[0-9]{1,3}' \
                -- . ':(exclude).github/workflows/ci.yml' | grep -vE ':192\.168\.1\.50$' || true)
          if [ -n "$hits$ips" ]; then
            printf '%s\n' "$hits" "$ips" | sed '/^$/d'
            echo "::error::secret, private address or personal data found (see above)"
            exit 1
          fi
          echo "no secrets or personal data found"
